name: build

on:
  push:
    branches: [main]
    # A README does not change the image, and a build here pushes `:latest' —
    # the tag every station watching this image rolls onto. Without this, a
    # typo fix in a `.md` file redeploys the fleet for nothing. Pull requests
    # are not filtered: the tree checks cost seconds and always run.
    #
    # ⛔ `scripts/**` is deliberately NOT ignored: the Dockerfile COPYs
    # `scripts/run-once.sh' to /usr/local/bin and makes it the ENTRYPOINT, so
    # ignoring that directory would merge a change to the entrypoint and ship
    # no image. An operator-script edit rebuilding the image is a cost; a
    # silent stale entrypoint on every box is not.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # A branch had no check at all: a reviewer could only be told "it
  # compiles here", which is how a suite that could not run a single case
  # stayed green for a month (macula-internal/macula-e2e#1). The image job
  # stays main-only, since it tags `:latest` from whatever it builds.
  pull_request:
  workflow_dispatch:

jobs:
  # Elvis was configured in rebar.config but nothing ever ran it, so the
  # rules were advisory: a nesting violation reached main without comment.
  # The probes here are the instrument the fleet is judged by, so they get
  # linted like library code.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.24'

      - name: Elvis
        run: rebar3 as lint lint

  # The offline probe checks. They start macula, which needs ML-DSA from
  # libcrypto (a stock runner has none) and its NIFs built with Rust, so they
  # run in the team's pinned OTP image, the one macula's own CI uses.
  eunit:
    runs-on: ubuntu-latest
    container: ghcr.io/macula-io/macula-ci-otp:20260923-1352@sha256:aff1d39bc4aa29d13044b90b38e9b7f4b757d50818cc11c5bb7e84cdbf82ac70
    steps:
      - uses: actions/checkout@v4

      - name: eunit
        run: rebar3 eunit

  # ⛔ eunit cannot see the rot this harness suffered (macula-internal/
  # macula-e2e#1): Erlang resolves remote calls at run time, so sixteen calls
  # to `macula_identity' — a module macula deleted at 12 — compiled happily,
  # passed lint and eunit, and failed only when a case tried to run them.
  # xref reads those calls before anything runs, which is why it is here.
  #
  # It gates, and it is meant to: `rebar3 xref' exits 1 on any finding. The
  # tree was not clean when this job was first written — 132 findings at
  # ff6ead0 — so it was withdrawn until the repair landed, rather than
  # reddening main on rot that pre-dated it. What `rebar.config' runs is
  # `undefined_function_calls' and `undefined_functions' only; its
  # `xref_checks' entry says why `exports_not_used' is not one of them here.
  xref:
    runs-on: ubuntu-latest
    container: ghcr.io/macula-io/macula-ci-otp:20260923-1352@sha256:aff1d39bc4aa29d13044b90b38e9b7f4b757d50818cc11c5bb7e84cdbf82ac70
    steps:
      - uses: actions/checkout@v4

      - name: xref
        run: rebar3 xref

      # `rebar3 xref' analyses the default profile and never sees `test/', so a
      # suite calling a function that no longer exists passes all of the above
      # and fails only when the case runs — the rot of e2e#1, in the one place
      # CI cannot execute. The script compiles the test profile and analyses
      # those beams; red-first is one call reverted to a removed arity.
      - name: xref over the test beams
        run: scripts/xref-test-beams.sh

  # ⛔ The live burst is NOT a CI job, deliberately. The stations are
  # AAAA-only and a GitHub-hosted runner has no IPv6 egress
  # (`seam/realm_seam_SUITE`'s own header records mcl-om's live-mesh-tests
  # job burning 18 minutes a run for a deterministic red), and this
  # repository is PUBLIC, so no self-hosted runner may take work from it.
  # A job that can only read as skipped is theatre; the burst runs on demand
  # instead, from a machine with IPv6 egress — `scripts/run-page-burst.sh`,
  # and the README says when.

  image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [lint, eunit, xref]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/macula-internal/macula-e2e:latest
            ghcr.io/macula-internal/macula-e2e:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
