name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Elvis was configured in rebar.config but nothing ever ran it, so the
  # rules were advisory: a nesting violation reached main without comment.
  # The probes here are the instrument the fleet is judged by, so they get
  # linted like library code.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          rebar3-version: '3.24'

      - name: Elvis
        run: rebar3 as lint lint

  image:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/macula-internal/macula-e2e:latest
            ghcr.io/macula-internal/macula-e2e:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
