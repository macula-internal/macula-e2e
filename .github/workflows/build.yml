name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Elvis was configured in rebar.config but nothing ever ran it, so the
  # rules were advisory: a nesting violation reached main without comment.
  # The probes here are the instrument the fleet is judged by, so they get
  # linted like library code.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.24'

      - name: Elvis
        run: rebar3 as lint lint

  # The offline probe checks. They start macula, which needs ML-DSA from
  # libcrypto (a stock runner has none) and its NIFs built with Rust, so they
  # run in the team's pinned OTP image, the one macula's own CI uses.
  eunit:
    runs-on: ubuntu-latest
    container: ghcr.io/macula-io/macula-ci-otp:20260923-1352@sha256:aff1d39bc4aa29d13044b90b38e9b7f4b757d50818cc11c5bb7e84cdbf82ac70
    steps:
      - uses: actions/checkout@v4

      - name: eunit
        run: rebar3 eunit

  # ⛔ eunit cannot see the rot this harness suffered (macula-internal/
  # macula-e2e#1): Erlang resolves remote calls at run time, so a suite that
  # cannot start a single case at its own pin leaves eunit green. Only
  # `rebar3 ct` runs what a deployment runs.
  #
  # It cannot run here yet. The fleet's stations are AAAA-only, and a
  # GitHub-hosted runner has no IPv6 egress (`seam/realm_seam_SUITE`'s own
  # header records this: mcl-om's live-mesh-tests job burned 18 minutes a run
  # for a deterministic red), so a hosted runner can never reach a station.
  # Pointing this job at ubuntu-latest would not be a gate, it would be a
  # guaranteed red.
  #
  # It runs when BOTH exist, and only then:
  #   1. a runner with IPv6 egress and a `pq' label registered for this
  #      repository or its org (none is today: macula-internal has
  #      `msi00-internal-1', which is neither labelled ipv6 nor allowed to
  #      take work from a public repository without that decision being
  #      taken deliberately), and
  #   2. `MACULA_E2E_CT_SEED` as a repository variable, in the pinned form
  #      `https://host:4433#<64 hex node id>` macula 16 requires.
  #
  # Skipping is visible as a skipped job, never as a green suite: an unset
  # seed must not read like a passing gate.
  ct:
    if: vars.MACULA_E2E_CT_SEED != ''
    runs-on: [self-hosted, pq, ipv6]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Common Test against the live fleet
        env:
          MACULA_E2E_BOOTSTRAP: ${{ vars.MACULA_E2E_CT_SEED }}
        run: rebar3 ct --suite test/macula_e2e_SUITE

  image:
    runs-on: ubuntu-latest
    needs: [lint, eunit]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/macula-internal/macula-e2e:latest
            ghcr.io/macula-internal/macula-e2e:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
